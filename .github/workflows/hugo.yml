# Builds the Hugo site on every pull request (as a required check for main),
# builds + deploys to GitHub Pages on every push to main, and rebuilds monthly
# so citation counts from OpenAlex stay current.
name: Deploy Hugo site to Pages

on:
  # Build and deploy on pushes to the default branch
  push:
    branches: ["main"]

  # Build only (no deploy) for pull requests, so they can be required to pass
  pull_request:

  # Monthly rebuild + deploy to refresh citation counts (1st of the month, 09:23 UTC)
  schedule:
    - cron: "23 9 1 * *"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Deploys share one group and are never cancelled mid-run.
# PR builds get a group per PR, and a newer push to the PR cancels the older build.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  # Build job (this job's name, "build", is the required status check on main)
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.169.0
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Install Node.js dependencies
        run: "[[ -f package-lock.json || -f npm-shrinkwrap.json ]] && npm ci || true"
      # Writes data/citations.json. If OpenAlex is unreachable, the site still
      # builds; the citation counts are just hidden until the next run.
      - name: Fetch citation counts from OpenAlex
        continue-on-error: true
        run: python3 scripts/fetch_citations.py
      - name: Build with Hugo
        env:
          # For maximum backward compatibility with Hugo modules
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
          # PR builds skip "Setup Pages", so fall back to the live URL
          BASE_URL: ${{ steps.pages.outputs.base_url || 'https://lundq163.github.io' }}
        run: |
          hugo \
            --minify \
            --baseURL "${BASE_URL}/"
      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  # Deployment job (never runs for pull requests)
  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
