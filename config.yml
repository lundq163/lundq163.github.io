          title: Jacob Lundquist
          subtitle: |
            Hello and welcome! A little about me:

            I am currently pursuing an MBA at Columbia Business School and an MS in Artificial Intelligence and Machine Learning at Columbia Engineering. Here, I am deepening my expertise in ML/DL while building the leadership, strategy and management skills to turn technical projects into real-world, measurable impact.

            Before Columbia, I spent 5+ years building software systems and leading technical projects in large-scale neuroimaging and clinical research. Most recently, I was at the Masonic Institute for the Developing Brain, where I developed ML/computer vision systems, data infrastructure and automated research workflows. Previously, I completed my BS at the University of Wisconsin–Madison, double majoring in physics and neurobiology. That’s where I first began cultivating my strongest skills in management, machine learning, data science, software engineering and high-performance computing.

            This site is designed to be a canvas displaying my projects and contributions to date. Please explore my work, or get in touch via the Calendly link. I am always happy to connect.
